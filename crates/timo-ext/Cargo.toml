[package]
name = "timo-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extension host: discovery, manifests, diagnostics and QuickJS runtime (Phase 2)"

[features]
default = ["pack"]
pack = ["dep:rolldown"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
rquickjs = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
globset = { workspace = true }
timo-ai = { workspace = true }
timo-agent = { workspace = true }
timo-config = { workspace = true }
rolldown = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
timo-tools = { workspace = true }

[lints]
workspace = true
